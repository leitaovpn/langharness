[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "langharness-core"
version = "0.1.0"
description = "Plugin-driven LangChain agent on Pelix/iPOPO"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain>=1.4.0",
    "langchain-anthropic>=1.7.2",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.2",
    "langchain-experimental>=0.4.2",
    "langchain-openai>=1.6.0",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "iPOPO>=3.2.2",
    "pydantic>=2.13.5",
    "prompt-toolkit>=3.0.52",
    "rich>=14.2.0",
    "uvicorn>=0.52.4",
    "websockets>=16.0",
]

[project.scripts]
langharness = "langharness.__main__:main"

[project.entry-points."langharness.config"]
config = "langharness_config.plugin:builtin_package"

[project.entry-points."langharness.plugins"]
agent-tools = "langharness_core.plugin:agent_tools_package"
builtin-api = "langharness_api.plugin:builtin_package"
builtin-cli = "langharness_cli.plugin:builtin_package"
builtin-config = "langharness_config.plugin:builtin_package"
builtin-core = "langharness_core.plugin:builtin_package"
builtin-logging = "langharness_logging.plugin:builtin_package"
dynamic-core = "langharness_core.plugin:dynamic_package"

[project.optional-dependencies]
dev = [
    "mypy>=2.3.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
]
packaging = [
    "build>=1.3.0",
    "pyinstaller>=6.16.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
langharness_config = ["config/langharness.toml"]

[tool.ruff]
target-version = "py313"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
strict = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true
strict = false

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
pythonVersion = "3.13"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
pythonpath = ["src"]
markers = [
    "real_llm: exercises a real external LLM provider and is skipped by default",
]

[tool.coverage.run]
source = [
    "langharness",
    "langharness_scope",
    "langharness_config",
    "langharness_logging",
    "langharness_core",
    "langharness_plugin",
    "langharness_api",
    "langharness_cli",
]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 95
precision = 2
